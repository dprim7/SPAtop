# ---------------------------------------------------
# REQUIRED - INPUTS - List all inputs to SPANet here.
# ---------------------------------------------------
INPUTS:
  # -----------------------------------------------------------------------------
  # REQUIRED - SEQUENTIAL - inputs which can have an arbitrary number of vectors.
  # -----------------------------------------------------------------------------
  SEQUENTIAL:
    Jets:
      pt: log_normalize
      eta: normalize
      sinphi: none
      cosphi: none
      btag: none
      mass: normalize
      matchedfj: none
      deltaRfj: normalize
    BoostedJets:
      fj_pt: log_normalize
      fj_eta: normalize
      fj_sinphi: none
      fj_cosphi: none
      fj_mass: normalize
      fj_sdmass: normalize
      fj_Ttag: none
      fj_Wtag: none
      fj_tau21: none
      fj_tau32: none
      fj_ncharged: normalize
  # ---------------------------------------------------------------------
  # REQUIRED - GLOBAL - inputs which will have a single vector per event.
  # ---------------------------------------------------------------------
  GLOBAL:

# ----------------------------------------------------------------------
# REQUIRED - EVENT - Complete list of resonance particles and daughters.
# ----------------------------------------------------------------------
EVENT:
  FRt1:
    - b: Jets
    - q1: Jets
    - q2: Jets
  FRt2:
    - b: Jets
    - q1: Jets
    - q2: Jets
  FRt3:
    - b: Jets
    - q1: Jets
    - q2: Jets
  FRt4:
    - b: Jets
    - q1: Jets
    - q2: Jets
  FRt5:
    - b: Jets
    - q1: Jets
    - q2: Jets
  FRt6:
    - b: Jets
    - q1: Jets
    - q2: Jets
  SRqqt1:
    - b: Jets
    - qq: BoostedJets
  SRqqt2:
    - b: Jets
    - qq: BoostedJets
  SRqqt3:
    - b: Jets
    - qq: BoostedJets
  SRqqt4:
    - b: Jets
    - qq: BoostedJets
  SRqqt5:
    - b: Jets
    - qq: BoostedJets
  SRqqt6:
    - b: Jets
    - qq: BoostedJets
  FBt1:
    - bqq: BoostedJets
  FBt2:
    - bqq: BoostedJets
  FBt3:
    - bqq: BoostedJets
  FBt4:
    - bqq: BoostedJets
  FBt5:
    - bqq: BoostedJets
  FBt6:
    - bqq: BoostedJets

PERMUTATIONS:
    EVENT:
      - [[FRt1, FRt2, FRt3, FRt4, FRt5, FRt6], [SRqqt1, SRqqt2, SRqqt3, SRqqt4, SRqqt5, SRqqt6], [FBt1, FBt2, FBt3, FBt4, FBt5, FBt6]]
    FRt1:
      - [ q1, q2 ]
    FRt2:
      - [ q1, q2 ]
    FRt3:
      - [ q1, q2 ]
    FRt4:
      - [ q1, q2 ]
    FRt5:
      - [ q1, q2 ]
    FRt6:
      - [ q1, q2 ]

REGRESSIONS:


CLASSIFICATIONS:
