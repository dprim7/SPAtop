# Per-top pT regression on the trained pairwise model (ttbar, large dataset).
#
# GENERATED by kube/render_massreg_job.py : edit the scripts under
# src/data/delphes/ and re-render, do not hand-edit the embedded python.
#
# Why pT and not mass: generation fixes the top mass (set param_card mass 6
# 172.5), so per-event parton mass varies only by the Breit-Wigner width, order
# 1.3 GeV, against a 3-jet mass resolution of order 15 GeV. That target is a
# constant in disguise. Top pT spans hundreds of GeV, its truth is already in
# the file as TARGETS/<particle>/pt, and it is directly comparable to the pT
# curves we already produce. Mass follows once this path is proven, with the
# gen-jet triplet mass as the target.
#
# No SPANet fork: dprim7/SPANet@feat/pairwise-attention already parses
# REGRESSIONS, builds RegressionDecoder, and supports --state_dict (strict=False)
# plus --freeze_state_dict, which is exactly "bolt a head onto trained weights".
#
# The job refuses to reach the GPU until preflight passes: the event file
# parses, every parsed regression key exists in the h5, and the checkpoint
# supplies the non-regression weights.
apiVersion: batch/v1
kind: Job
metadata:
  name: dp-massreg-pt
  namespace: axol1tl
  labels:
    jobgroup: spatop-job-train
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        job-name: dp-massreg-pt
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        fsGroup: 0
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
      containers:
      - name: training
        image: gitlab-registry.nrp-nautilus.io/mquinnan/top-spanet:spatop-container
        command:
        - /bin/bash
        - -c
        - |
          set -e

          SCRIPTS=/data/spatop/scripts
          WORK=/data/spatop/massreg
          mkdir -p $SCRIPTS $WORK

          echo "########## 0. INSTALL ##########"
          pip install -q git+https://github.com/dprim7/SPANet.git@feat/pairwise-attention
          pip install -q tensorboard rich

          echo "########## 1. WRITE DATA SCRIPTS ##########"
          cat > $SCRIPTS/add_regression_targets.py <<'SCRIPT_EOF'
          #!/usr/bin/env python3
          """Add SPANet regression targets to an existing SPAtop h5 file.

          The converter already stores the parton-level top pT once per topology
          particle as ``TARGETS/<particle>/pt``, but SPANet reads regression truth from a
          separate group, ``REGRESSIONS/<particle>/PARTICLE/<name>``. That is the only
          thing standing between the files we have and a regression run, so this copies
          the values across in place rather than reprocessing 15M events through Delphes.

          Masking follows SPANet's own convention: a NaN target means "skip this event"
          (``jet_reconstruction_training.py``, ``current_mask = ~torch.isnan(target)``).
          An event only contributes to a particle's regression loss if that particle is
          actually present, i.e. ``TARGETS/<particle>/mask`` is set. Regressing a top's
          pT off the FRt1 vector in an event with no resolved top would be asking the
          head to predict a quantity from a slot that reconstructs nothing.

          The write is additive and idempotent: existing datasets are untouched, and
          re-running replaces only the REGRESSIONS group. SPANet ignores the group unless
          the event file declares it, so an augmented file still works for every existing
          training. h5py has no concurrent-write protection, so do not run this while a
          job is reading the file.

              python add_regression_targets.py FILE.h5 [FILE2.h5 ...] [--targets pt]
              python add_regression_targets.py FILE.h5 --dry-run
          """
          import argparse
          import sys

          import h5py
          import numpy as np

          TARGETS = "TARGETS"
          REGRESSIONS = "REGRESSIONS"
          PARTICLE = "PARTICLE"


          def particles_with(h5, name):
              """Topology particles carrying a truth field of this name."""
              if TARGETS not in h5:
                  return []
              return [p for p in h5[TARGETS] if name in h5[TARGETS][p]]


          def augment(path, names, dry_run=False):
              mode = "r" if dry_run else "r+"
              with h5py.File(path, mode) as h5:
                  n_written = 0
                  for name in names:
                      particles = particles_with(h5, name)
                      if not particles:
                          print(f"  no particle carries TARGETS/*/{name}, skipping")
                          continue

                      for p in particles:
                          source = h5[f"{TARGETS}/{p}/{name}"]
                          values = np.asarray(source[:], dtype=np.float32)

                          mask_path = f"{TARGETS}/{p}/mask"
                          if mask_path in h5:
                              mask = np.asarray(h5[mask_path][:]).astype(bool)
                              values = np.where(mask, values, np.nan).astype(np.float32)
                              kept = int(mask.sum())
                          else:
                              kept = values.size
                              print(f"  WARNING {p}: no mask, using every event")

                          key = f"{REGRESSIONS}/{p}/{PARTICLE}/{name}"
                          finite = values[np.isfinite(values)]
                          frac = kept / max(1, values.size)
                          summary = (f"  {key:34} {kept:>10,}/{values.size:,} events "
                                     f"({frac:5.1%})  mean {finite.mean():7.1f} "
                                     f"std {finite.std():6.1f}")
                          if dry_run:
                              print("  [dry-run]" + summary)
                              continue

                          if key in h5:
                              del h5[key]
                          h5.create_dataset(key, data=values, dtype="float32",
                                            compression="gzip", compression_opts=4)
                          print(summary)
                          n_written += 1
                  return n_written


          def verify(path, names):
              """Re-open and confirm the group reads back with sane content."""
              problems = []
              with h5py.File(path, "r") as h5:
                  for name in names:
                      for p in particles_with(h5, name):
                          key = f"{REGRESSIONS}/{p}/{PARTICLE}/{name}"
                          if key not in h5:
                              problems.append(f"{key} missing")
                              continue
                          values = h5[key][:]
                          truth = h5[f"{TARGETS}/{p}/{name}"][:]
                          if values.shape != truth.shape:
                              problems.append(f"{key} shape {values.shape} != {truth.shape}")
                          finite = np.isfinite(values)
                          if not finite.any():
                              problems.append(f"{key} is entirely NaN")
                              continue
                          # Every kept value must equal the source it was copied from.
                          if not np.allclose(values[finite], truth[finite], rtol=0, atol=0):
                              problems.append(f"{key} values differ from {TARGETS}/{p}/{name}")
                          if f"{TARGETS}/{p}/mask" in h5:
                              mask = np.asarray(h5[f"{TARGETS}/{p}/mask"][:]).astype(bool)
                              if not np.array_equal(finite, mask):
                                  problems.append(f"{key} finite pattern != particle mask")
              return problems


          def main():
              ap = argparse.ArgumentParser(description=__doc__,
                                           formatter_class=argparse.RawDescriptionHelpFormatter)
              ap.add_argument("files", nargs="+", help="h5 files to augment in place")
              ap.add_argument("--targets", nargs="+", default=["pt"],
                              help="TARGETS field names to expose as regressions")
              ap.add_argument("--dry-run", action="store_true",
                              help="report what would be written, change nothing")
              args = ap.parse_args()

              failed = False
              for path in args.files:
                  print(f"\n{path}")
                  augment(path, args.targets, dry_run=args.dry_run)
                  if args.dry_run:
                      continue
                  problems = verify(path, args.targets)
                  if problems:
                      failed = True
                      for p in problems:
                          print(f"  PROBLEM: {p}")
                  else:
                      print("  verified")

              if failed:
                  sys.exit(1)


          if __name__ == "__main__":
              main()
          SCRIPT_EOF
          cat > $SCRIPTS/add_regression_block.py <<'SCRIPT_EOF'
          #!/usr/bin/env python3
          """Write a copy of a SPANet event file with its REGRESSIONS block filled in.

          The particle list is read from the event file itself rather than hard-coded.
          That matters: the fine-tuned model has to declare exactly the particles its
          checkpoint was trained with, and the event file on the volume does not
          necessarily match the one in this repo (v11 dropped the SRbq arm). Deriving the
          block from the source file makes the mismatch impossible.

              python add_regression_block.py IN.yaml OUT.yaml [--targets pt] [--type gaussian]
          """
          import argparse

          import yaml

          REGRESSIONS = "REGRESSIONS"
          PARTICLE = "PARTICLE"
          EVENT = "EVENT"


          def build(source, targets, reg_type):
              with open(source) as f:
                  info = yaml.safe_load(f)

              particles = list(info.get(EVENT, {}) or {})
              if not particles:
                  raise SystemExit(f"{source}: no EVENT particles found")

              # RegressionInfo(name, type): a bare string takes the default gaussian, a
              # [name, type] pair sets it explicitly.
              block = {p: {PARTICLE: [[t, reg_type] for t in targets]} for p in particles}
              info[REGRESSIONS] = block
              return info, particles


          def main():
              ap = argparse.ArgumentParser(description=__doc__,
                                           formatter_class=argparse.RawDescriptionHelpFormatter)
              ap.add_argument("source")
              ap.add_argument("output")
              ap.add_argument("--targets", nargs="+", default=["pt"])
              ap.add_argument("--type", dest="reg_type", default="gaussian",
                              choices=["gaussian", "laplacian", "log_gaussian"])
              args = ap.parse_args()

              info, particles = build(args.source, args.targets, args.reg_type)
              with open(args.output, "w") as f:
                  yaml.safe_dump(info, f, default_flow_style=False, sort_keys=False)

              print(f"{args.output}: {len(particles)} particles x {len(args.targets)} target(s)")
              for p in particles:
                  for t in args.targets:
                      print(f"  REGRESSIONS/{p}/{PARTICLE}/{t}  ({args.reg_type})")


          if __name__ == "__main__":
              main()
          SCRIPT_EOF

          echo "########## 2. LOCATE CONFIG AND CHECKPOINT ##########"
          python - <<'PYEOF'
          import glob, json, os

          cfg_path = "/data/spatop/options_files/v11/spatop_v11_pairwise1GPU.json"
          if not os.path.exists(cfg_path):
              cfg_path = "/data/spatop/options_files/v11/spatop_v11_full1GPU.json"
          cfg = json.load(open(cfg_path))
          print("base config:", cfg_path)
          for k in ("training_file", "validation_file", "testing_file", "event_info_file"):
              print(f"  {k:18} = {cfg.get(k)}")

          ckpts = sorted(glob.glob("/data/spatop/logs/**/*.ckpt", recursive=True))
          pair = [c for c in ckpts if "pairwise" in c.lower()]
          if not pair:
              raise SystemExit("FATAL: no pairwise checkpoint found under /data/spatop/logs")
          best = [c for c in pair if "best" in os.path.basename(c).lower()]
          chosen = (best or pair)[0]
          print(f"{len(pair)} pairwise checkpoints, using: {chosen}")

          with open("/data/spatop/massreg/paths.json", "w") as f:
              json.dump({"config": cfg_path, "checkpoint": chosen,
                         "event_info_file": cfg["event_info_file"],
                         "training_file": cfg["training_file"],
                         "validation_file": cfg["validation_file"],
                         "testing_file": cfg.get("testing_file")}, f, indent=2)
          PYEOF

          PATHS=/data/spatop/massreg/paths.json
          EVENT_IN=$(python -c "import json;print(json.load(open('$PATHS'))['event_info_file'])")
          EVENT_OUT=/data/spatop/massreg/tt_hadronic_regression.yaml

          echo "########## 3. EVENT FILE WITH REGRESSIONS ##########"
          python $SCRIPTS/add_regression_block.py "$EVENT_IN" "$EVENT_OUT" --targets pt --type gaussian

          echo "########## 4. ADD REGRESSION TARGETS TO THE H5 ##########"
          # Additive and idempotent. SPANet ignores REGRESSIONS unless the event
          # file declares it, so the augmented files stay valid for every
          # existing training.
          python - <<'PYEOF' > /data/spatop/massreg/files.txt
          import json
          p = json.load(open("/data/spatop/massreg/paths.json"))
          for k in ("training_file", "validation_file", "testing_file"):
              if p.get(k):
                  print(p[k])
          PYEOF
          # The trailing -- matters: xargs appends the file list, and without it
          # argparse swallows the filenames into --targets (nargs=+).
          xargs -a /data/spatop/massreg/files.txt python $SCRIPTS/add_regression_targets.py --targets pt --

          echo "########## 5. PREFLIGHT (no GPU work until this passes) ##########"
          python - <<'PYEOF'
          import json
          import numpy as np
          import h5py, torch
          from spanet.dataset.event_info import EventInfo
          from spanet.dataset.types import SpecialKey

          paths = json.load(open("/data/spatop/massreg/paths.json"))
          info = EventInfo.read_from_yaml("/data/spatop/massreg/tt_hadronic_regression.yaml")

          wanted = []
          for particle in info.event_particles:
              for t in info.regressions[particle][SpecialKey.Particle]:
                  wanted.append(f"REGRESSIONS/{particle}/PARTICLE/{t.name}")
          print(f"parser produced {len(wanted)} regression keys")
          if not wanted:
              raise SystemExit("FATAL: event file declares no regressions")

          problems = []
          for key in ("training_file", "validation_file"):
              with h5py.File(paths[key], "r") as f:
                  for w in wanted:
                      if w not in f:
                          problems.append(f"{key}: {w} missing")
                          continue
                      v = f[w][:]
                      if not np.isfinite(v).any():
                          problems.append(f"{key}: {w} all NaN")

          sd = torch.load(paths["checkpoint"], map_location="cpu")["state_dict"]
          reg_keys = [k for k in sd if "regression" in k.lower()]
          print(f"checkpoint tensors: {len(sd)}, regression tensors: {len(reg_keys)}")

          for p in problems:
              print("PROBLEM:", p)
          if problems:
              raise SystemExit(f"FATAL: preflight found {len(problems)} problems")
          print("preflight OK")
          PYEOF

          echo "########## 6. REGRESSION CONFIG ##########"
          CFG=/data/spatop/massreg/spatop_massreg_pt.json
          python - <<'PYEOF'
          import json
          paths = json.load(open("/data/spatop/massreg/paths.json"))
          cfg = json.load(open(paths["config"]))
          cfg.update({
              "event_info_file": "/data/spatop/massreg/tt_hadronic_regression.yaml",
              # Turn the regression term on. It is gated on > 0 in
              # jet_reconstruction_training.py, which is why it was inert until now.
              "regression_loss_scale": 1.0,
              "num_regression_layers": 3,
              "num_dataloader_workers": 0,
              "learning_rate": 1e-3,
              "epochs": 15,
          })
          json.dump(cfg, open("/data/spatop/massreg/spatop_massreg_pt.json", "w"), indent=4)
          print("regression config written")
          for k in ("regression_loss_scale", "num_regression_layers", "learning_rate", "epochs"):
              print(f"  {k} = {cfg[k]}")
          PYEOF

          echo "########## 7. FINE-TUNE THE HEAD ##########"
          # -sf loads weights only, strict=False, so the new regression
          # parameters appear as missing keys and initialise fresh.
          # -fsf freezes everything that came from the checkpoint, so this
          # trains the regression head alone and cannot damage the assignment
          # performance we already measured.
          CKPT=$(python -c "import json;print(json.load(open('$PATHS'))['checkpoint'])")
          python -m spanet.train \
            -of $CFG \
            -sf "$CKPT" \
            -fsf \
            -l /data/spatop/logs/ \
            -n spatop_massreg_pt_output

          echo "########## DONE ##########"
        resources:
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /data
          name: spatopvol
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: spatopvol
        persistentVolumeClaim:
          claimName: traindatavol
